<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>judge</title>
<style>
  :root { color-scheme: light dark;
          --fg:#1b1b1b; --dim:#7a7a7a; --line:#dcdcdc; --bg:#fbfbf9; --accent:#2f5d8a; --bar:41px; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#dcdcd6; --dim:#8a8a84; --line:#333; --bg:#141414; --accent:#8ab4dd; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg); }
  body { font:14px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden; }
  .bar { position:fixed; top:0; left:0; right:0; height:var(--bar); z-index:10;
         background:var(--bg); border-bottom:1px solid var(--line);
         padding:10px 20px; font-size:13px; color:var(--dim);
         display:flex; gap:18px; align-items:baseline; }
  .bar b { color:var(--fg); font-weight:600; }
  .bar .sp { margin-left:auto; }
  button { font:inherit; font-size:13px; background:transparent; color:var(--fg);
           border:1px solid var(--line); border-radius:3px; padding:5px 11px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }

  #wrap { position:absolute; top:var(--bar); bottom:0; left:0; right:0; display:flex; flex-direction:column; }
  .premise { padding:12px 20px; border-bottom:1px solid var(--line); color:var(--dim); }
  .premise span { color:var(--fg); }
  .pair { flex:1; display:flex; min-height:0; }
  .side { flex:1 1 50%; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  .side:last-child { border-right:0; }
  .sidehead { padding:8px 18px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .sidehead .k { font-weight:600; }
  .body { flex:1; overflow-y:auto; padding:16px 18px 60px; }
  .post { margin:0 0 20px; }
  .meta { color:var(--dim); font-size:12.5px; }
  .who,.ment { font-weight:600; }
  .text { white-space:pre-wrap; word-break:break-word; margin-top:2px; }
  .empty { color:var(--dim); font-style:italic; }
  .foot { padding:10px 20px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .hint { color:var(--dim); font-size:12.5px; margin-left:auto; }
  table { border-collapse:collapse; font-size:13px; width:100%; margin-top:14px; }
  th,td { text-align:left; padding:6px 14px 6px 0; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; }
  .pad { padding:24px 28px 80px; overflow-y:auto; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="wrap"></div>

<script>
const KEY = "bbjudge.v2";
// known-bad quantisation, proven by the Q8_0 diagnostic; excluded so it does not
// consume attention losing 30 comparisons it was always going to lose
const EXCLUDE = ["gemma-4-E4B base [Q4_K_M]"];
let threads = [], pairs = [], cur = 0, votes = {}, showStandings = false;

function save() { localStorage.setItem(KEY, JSON.stringify({pairs, cur, votes})); }
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } }

fetch("threads.json").then(r => r.json()).then(d => {
  threads = Array.isArray(d) ? d : d.threads;
  const s = load();
  if (s.pairs && s.pairs.length) { pairs = s.pairs; cur = s.cur || 0; votes = s.votes || {}; }
  else { pairs = buildPairs(); save(); }
  render();
});

/* every unordered pair of arms, within the same opener, so the premise is controlled */
function buildPairs() {
  const byOpener = {};
  threads.forEach((t, i) => {
    if (EXCLUDE.includes(t.model)) return;
    (byOpener[t.opener_index] = byOpener[t.opener_index] || []).push(i);
  });
  const out = [];
  for (const oi of Object.keys(byOpener)) {
    const ids = byOpener[oi];
    for (let a = 0; a < ids.length; a++)
      for (let b = a + 1; b < ids.length; b++)
        out.push(Math.random() < 0.5 ? [ids[a], ids[b]] : [ids[b], ids[a]]);
  }
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

const judged = () => Object.keys(votes).length;

function render() {
  const bar = document.getElementById("bar"), wrap = document.getElementById("wrap");
  if (showStandings) return renderStandings(bar, wrap);

  if (cur >= pairs.length) {
    bar.innerHTML = `<b>done</b><span>${judged()} of ${pairs.length} judged</span>`
      + `<span class="sp"></span><button id="st">standings</button>`;
    wrap.innerHTML = `<div class="pad"><p>every pair judged.</p></div>`;
    document.getElementById("st").onclick = () => { showStandings = true; render(); };
    return;
  }

  const [li, ri] = pairs[cur];
  const L = threads[li], R = threads[ri];
  const v = votes[cur];

  bar.innerHTML = `<b>${cur + 1} / ${pairs.length}</b>`
    + `<span>${judged()} judged</span>`
    + `<span>opener ${L.opener_index}</span>`
    + `<span class="sp"></span>`
    + `<button id="st">standings</button>`;

  wrap.innerHTML =
      `<div class="premise">both threads open with: <span>${esc(L.posts[0].text)}</span></div>`
    + `<div class="pair">`
    +   `<div class="side"><div class="sidehead"><span class="k">left</span></div>`
    +     `<div class="body">${postsHTML(L, 1)}</div></div>`
    +   `<div class="side"><div class="sidehead"><span class="k">right</span></div>`
    +     `<div class="body">${postsHTML(R, 1)}</div></div>`
    + `</div>`
    + `<div class="foot">`
    +   `<span style="color:var(--dim)">which would you keep reading?</span>`
    +   `<button id="vl" class="${v === "L" ? "on" : ""}">&larr; left</button>`
    +   `<button id="vt" class="${v === "T" ? "on" : ""}">neither</button>`
    +   `<button id="vr" class="${v === "R" ? "on" : ""}">right &rarr;</button>`
    +   `<span class="hint">&larr; / &rarr; / space &middot; backspace to go back</span>`
    + `</div>`;

  document.getElementById("st").onclick = () => { showStandings = true; render(); };
  document.getElementById("vl").onclick = () => vote("L");
  document.getElementById("vt").onclick = () => vote("T");
  document.getElementById("vr").onclick = () => vote("R");
}

function vote(v) { votes[cur] = v; cur++; save(); render(); }

document.addEventListener("keydown", e => {
  if (showStandings || cur >= pairs.length) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); vote("L"); }
  else if (e.key === "ArrowRight") { e.preventDefault(); vote("R"); }
  else if (e.key === " ") { e.preventDefault(); vote("T"); }
  else if (e.key === "Backspace") { e.preventDefault(); if (cur > 0) { cur--; save(); render(); } }
});

function renderStandings(bar, wrap) {
  bar.innerHTML = `<b>standings</b><span>${judged()} of ${pairs.length} judged</span>`
    + `<span class="sp"></span><button id="bk">back to judging</button>`
    + `<button id="ex">export</button>`;

  const rec = {};
  const touch = m => (rec[m] = rec[m] || {w:0, l:0, t:0});
  Object.entries(votes).forEach(([k, v]) => {
    const [li, ri] = pairs[k];
    const lm = threads[li].model, rm = threads[ri].model;
    touch(lm); touch(rm);
    if (v === "L") { rec[lm].w++; rec[rm].l++; }
    else if (v === "R") { rec[rm].w++; rec[lm].l++; }
    else { rec[lm].t++; rec[rm].t++; }
  });

  const rows = Object.entries(rec).map(([m, r]) => {
    const dec = r.w + r.l;
    return {m, ...r, pct: dec ? r.w / dec : 0, n: dec + r.t};
  }).sort((a, b) => b.pct - a.pct);

  let html = `<div class="pad">`;
  if (!rows.length) html += `<p>no judgments yet.</p>`;
  else {
    html += `<table><tr><th>model</th><th>win %</th><th>won</th><th>lost</th>`
         + `<th>neither</th><th>comparisons</th></tr>`;
    for (const r of rows)
      html += `<tr><td>${esc(r.m)}</td><td>${(100*r.pct).toFixed(0)}%</td><td>${r.w}</td>`
           + `<td>${r.l}</td><td>${r.t}</td><td>${r.n}</td></tr>`;
    html += `</table><p style="color:var(--dim);margin-top:20px">`
         + `win % ignores "neither". a model needs roughly 15+ decided comparisons `
         + `before the number means much.</p>`;
  }
  html += `</div>`;
  wrap.innerHTML = html;

  document.getElementById("bk").onclick = () => { showStandings = false; render(); };
  document.getElementById("ex").onclick = () => {
    const out = {exported: new Date().toISOString(), judgments: Object.entries(votes).map(([k, v]) => ({
      pair: +k, winner: v,
      left: {model: threads[pairs[k][0]].model, opener_index: threads[pairs[k][0]].opener_index},
      right: {model: threads[pairs[k][1]].model, opener_index: threads[pairs[k][1]].opener_index},
    }))};
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], {type:"application/json"}));
    a.download = "judgments.json"; a.click();
  };
}

function postsHTML(t, from) {
  let h = "";
  for (const p of t.posts.slice(from)) {
    const body = p.text ? markNames(esc(p.text), t.participants || [])
                        : `<span class="empty">[no text]</span>`;
    h += `<div class="post"><div class="meta">`
       + `<span class="who" style="color:${hue(p.who)}">${esc(p.who)}</span> ${p.ts}</div>`
       + `<div class="text">${body}</div></div>`;
  }
  return h;
}

function markNames(html, pool) {
  if (!pool.length) return html;
  const alt = pool.slice().sort((a,b) => b.length - a.length)
                  .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  return html.replace(new RegExp("(^|[^A-Za-z0-9])(" + alt + ")(?![A-Za-z0-9])", "gi"),
    (m, pre, name) => pre + `<span class="ment" style="color:${hue(name.toLowerCase())}">${name}</span>`);
}

function hue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return `light-dark(hsl(${h} 62% 34%), hsl(${h} 58% 70%))`;
}

function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
</script>
</body>
</html>
