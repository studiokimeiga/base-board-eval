<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reader</title>
<style>
  :root { color-scheme: light dark;
          --fg:#1b1b1b; --dim:#7a7a7a; --line:#dcdcdc; --bg:#fbfbf9; --accent:#2f5d8a; --bar:41px; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#dcdcd6; --dim:#8a8a84; --line:#333; --bg:#141414; --accent:#8ab4dd; }
  }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); }
  body { font: 15px/1.75 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body.read { padding: 72px 24px 120px; }
  body.compare { padding: var(--bar) 0 0; overflow: hidden; }
  main { max-width: 68ch; margin: 0 auto; }
  body.compare main { max-width: none; }

  .bar {
    position: fixed; top:0; left:0; right:0; z-index:10; background:var(--bg);
    border-bottom:1px solid var(--line); padding:10px 24px; height:var(--bar);
    font-size:13px; color:var(--dim); display:flex; gap:20px; align-items:baseline;
  }
  .bar b { color:var(--fg); font-weight:600; }
  .bar .sp { margin-left:auto; }

  .post { margin: 0 0 26px; }
  .meta { color:var(--dim); font-size:12.5px; letter-spacing:.01em; }
  .no { color:var(--dim); }
  .who { font-weight:600; }
  .ment { font-weight:600; }
  .text { white-space: pre-wrap; word-break: break-word; margin-top:2px; }
  .empty { color:var(--dim); font-style:italic; }
  hr { border:0; border-top:1px solid var(--line); margin:32px 0; }
  .q { font-size:13px; color:var(--dim); margin:24px 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button {
    font:inherit; font-size:13px; background:transparent; color:var(--fg);
    border:1px solid var(--line); border-radius:3px; padding:6px 12px; cursor:pointer;
  }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .nav { display:flex; gap:8px; margin-top:32px; }
  table { border-collapse:collapse; font-size:13px; width:100%; margin-top:16px; }
  th,td { text-align:left; padding:6px 12px 6px 0; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; }

  /* ---- compare mode: full-height columns, horizontal scroll ---- */
  .cols {
    display:flex; height: calc(100vh - var(--bar));
    overflow-x:auto; overflow-y:hidden; scroll-snap-type: x proximity;
  }
  .col {
    flex: 0 0 calc(100vw / 4); min-width: 42ch; scroll-snap-align: start;
    height:100%; display:flex; flex-direction:column;
    border-right:1px solid var(--line);
  }
  .colhead {
    padding:10px 18px 12px; border-bottom:1px solid var(--line); background:var(--bg);
  }
  .colhead .lab { font-weight:600; font-size:15px; }
  .colbody { overflow-y:auto; padding:18px 18px 80px; font-size:13.5px; line-height:1.7; }
  .mini { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .mini button { font-size:11.5px; padding:3px 7px; border-radius:2px; line-height:1.3; }
</style>
</head>
<body class="read">
<div class="bar" id="bar"></div>
<main id="app"></main>

<script>
const TAGS = ["funny","eerie","boring","tries too hard","incoherent","sounds like an AI assistant","I'd repost this"];
const SHORT = {"funny":"funny","eerie":"eerie","boring":"boring","tries too hard":"tries hard",
               "incoherent":"incoherent","sounds like an AI assistant":"AI assistant","I'd repost this":"repost"};
let LABELS = [];
const KEY = "bbeval.v4";

let threads = [], order = [], cur = 0, state = {}, mode = "read";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify({order, cur, state, mode}));
}
function st(label) {
  return state[label] || (state[label] = {score:0, tags:[]});
}

fetch("threads.json").then(r => r.json()).then(d => {
  threads = Array.isArray(d) ? d : d.threads;
  LABELS = threads.map((_, i) =>
    i < 26 ? String.fromCharCode(65 + i) : String.fromCharCode(65 + i - 26) + "2");
  const saved = load();
  if (saved.order && saved.order.length === threads.length) {
    order = saved.order; state = saved.state || {}; cur = saved.cur || 0; mode = saved.mode || "read";
  } else {
    order = threads.map((_,i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    save();
  }
  render();
});

const rated = () => order.filter((_,k) => st(LABELS[k]).score).length;

function render() {
  const bar = document.getElementById("bar"), app = document.getElementById("app");
  document.body.className = mode;
  if (mode === "compare") return renderCompare(bar, app);
  document.body.className = "read";
  if (cur >= order.length) return reveal(bar, app);
  renderRead(bar, app);
}

function modeBtn() {
  const done = rated() === order.length;
  return `<span class="sp"></span>`
    + (done ? `<button id="rev" class="on">reveal &rarr;</button>` : ``)
    + `<button id="exp2">export</button>`
    + `<button id="mode">${mode === "read" ? "compare all" : "one at a time"}</button>`;
}
function wireMode() {
  const b = document.getElementById("mode");
  if (b) b.onclick = () => { mode = mode === "read" ? "compare" : "read"; save(); render(); };
  const r = document.getElementById("rev");
  if (r) r.onclick = () => { mode = "read"; cur = order.length; save(); render(); };
  const e = document.getElementById("exp2");
  if (e) e.onclick = exportPartial;
}

/* partial export, safe to use before the reveal: carries thread ids but no model
   names, so dumping ratings mid-run cannot de-blind the rest of the reading */
function exportPartial() {
  const out = {
    exported: new Date().toISOString(),
    rated: rated(), total: order.length, blind: true,
    ratings: order.map((ti, k) => ({
      label: LABELS[k], thread_id: threads[ti].id,
      opener_index: threads[ti].opener_index,
      score: st(LABELS[k]).score || null, tags: st(LABELS[k]).tags,
    })).filter(r => r.score || r.tags.length),
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], {type:"application/json"}));
  a.download = "ratings-partial.json"; a.click();
}

/* ---------- one thread per screen ---------- */
function renderRead(bar, app) {
  const label = LABELS[cur], t = threads[order[cur]], s = st(label);

  bar.innerHTML = `<b>${label}</b><span>${cur+1} / ${order.length}</span>`
    + `<span>${rated()} rated</span>` + modeBtn();

  let html = `<div class="meta">/x/ — thread 4471</div>`;
  html += postsHTML(t);
  html += `<hr><div class="q">would you keep reading?</div><div class="row" id="scores"></div>`;
  html += `<div class="q">tags</div><div class="row" id="tags"></div>`;
  html += `<div class="nav"><button id="prev">back</button><button id="next">next</button></div>`;
  app.innerHTML = html;

  scoreButtons(document.getElementById("scores"), s, false);
  tagButtons(document.getElementById("tags"), s, false);
  document.getElementById("prev").onclick = () => { if (cur > 0) cur--; save(); render(); };
  document.getElementById("next").onclick = () => { cur++; save(); render(); };
  wireMode();
  window.scrollTo(0,0);
}

/* ---------- all threads side by side ---------- */
function renderCompare(bar, app) {
  bar.innerHTML = `<b>compare</b><span>${order.length} threads</span>`
    + `<span>${rated()} rated</span>`
    + `<span>scroll sideways</span>` + modeBtn();

  let html = `<div class="cols" id="cols">`;
  order.forEach((ti, k) => {
    html += `<div class="col"><div class="colhead">`
      + `<span class="lab">${LABELS[k]}</span>`
      + `<div class="mini" data-sc="${k}"></div>`
      + `<div class="mini" data-tg="${k}"></div>`
      + `</div><div class="colbody">${postsHTML(threads[ti])}</div></div>`;
  });
  html += `</div>`;
  app.innerHTML = html;

  order.forEach((ti, k) => {
    const s = st(LABELS[k]);
    scoreButtons(app.querySelector(`[data-sc="${k}"]`), s, true);
    tagButtons(app.querySelector(`[data-tg="${k}"]`), s, true);
  });
  wireMode();
}

function postsHTML(t) {
  let h = "";
  for (const p of t.posts) {
    const body = p.text
      ? markNames(esc(p.text), t.participants || [])
      : `<span class="empty">[no text]</span>`;
    const who = p.who
      ? `<span class="who" style="color:${hue(p.who)}">${esc(p.who)}</span> `
        + `<span class="no">${p.ts}</span>`
      : `${p.n} Anonymous ${p.ts} <span class="no">No.${p.no}</span>`;
    h += `<div class="post"><div class="meta">${who}</div>`
       + `<div class="text">${body}</div></div>`;
  }
  return h;
}

/* keep scroll position when re-rendering compare mode after a click */
function repaint() {
  if (mode !== "compare") { save(); render(); return; }
  const cols = document.getElementById("cols");
  const x = cols ? cols.scrollLeft : 0;
  const ys = cols ? [...cols.querySelectorAll(".colbody")].map(e => e.scrollTop) : [];
  save(); render();
  const c2 = document.getElementById("cols");
  if (c2) {
    c2.scrollLeft = x;
    [...c2.querySelectorAll(".colbody")].forEach((e,i) => e.scrollTop = ys[i] || 0);
  }
}

function scoreButtons(host, s, mini) {
  if (!host) return;
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.textContent = i;
    if (s.score === i) b.className = "on";
    b.onclick = () => { s.score = i; repaint(); };
    host.appendChild(b);
  }
}

function tagButtons(host, s, mini) {
  if (!host) return;
  for (const tag of TAGS) {
    const b = document.createElement("button");
    b.textContent = mini ? SHORT[tag] : tag;
    if (s.tags.includes(tag)) b.className = "on";
    b.onclick = () => {
      const i = s.tags.indexOf(tag);
      if (i < 0) s.tags.push(tag); else s.tags.splice(i,1);
      repaint();
    };
    host.appendChild(b);
  }
}

/* ---------- reveal ---------- */
function reveal(bar, app) {
  const missing = order.map((_,k) => LABELS[k]).filter(l => !st(l).score);
  if (missing.length) {
    bar.innerHTML = `<b>almost</b><span>${rated()} / ${order.length} rated</span>` + modeBtn();
    app.innerHTML = `<p>unrated: ${missing.join(", ")}</p>`
      + `<div class="nav"><button id="g">go to ${missing[0]}</button></div>`;
    document.getElementById("g").onclick = () => { cur = LABELS.indexOf(missing[0]); save(); render(); };
    wireMode();
    return;
  }

  bar.innerHTML = `<b>reveal</b><span>${order.length} / ${order.length} rated</span>`;
  const by = {};
  order.forEach((ti, k) => {
    const m = threads[ti].model, s = st(LABELS[k]);
    (by[m] = by[m] || {scores:[], tags:{}, labels:[]});
    by[m].scores.push(s.score);
    by[m].labels.push(LABELS[k]);
    s.tags.forEach(t => by[m].tags[t] = (by[m].tags[t]||0)+1);
  });
  const rows = Object.entries(by)
    .map(([m,v]) => ({m, mean: v.scores.reduce((a,b)=>a+b,0)/v.scores.length, ...v}))
    .sort((a,b) => b.mean - a.mean);

  let html = `<h3 style="font-weight:600">label &rarr; model</h3><table><tr><th>label</th>`
    + `<th>score</th><th>opener</th><th>model</th></tr>`;
  order.forEach((ti,k) => {
    html += `<tr><td>${LABELS[k]}</td><td>${st(LABELS[k]).score}</td>`
         + `<td>${threads[ti].opener_index}</td><td>${esc(threads[ti].model)}</td></tr>`;
  });
  html += `</table><h3 style="font-weight:600;margin-top:36px">by model</h3><table>`
       + `<tr><th>model</th><th>mean</th><th>threads</th><th>tags</th></tr>`;
  for (const r of rows) {
    const tags = Object.entries(r.tags).sort((a,b)=>b[1]-a[1])
      .map(([t,c]) => `${t} ${c}`).join(" &middot; ") || "—";
    html += `<tr><td>${esc(r.m)}</td><td>${r.mean.toFixed(2)}</td>`
         + `<td>${r.labels.join(" ")}</td><td>${tags}</td></tr>`;
  }
  html += `</table><div class="nav"><button id="exp">export ratings JSON</button>`
       + `<button id="back">back to ${LABELS[order.length-1]}</button></div>`;
  app.innerHTML = html;

  document.getElementById("exp").onclick = () => {
    const out = {exported: new Date().toISOString(), ratings: order.map((ti,k) => ({
      label: LABELS[k], model: threads[ti].model, opener_index: threads[ti].opener_index,
      score: st(LABELS[k]).score, tags: st(LABELS[k]).tags, posts: threads[ti].posts
    }))};
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)], {type:"application/json"}));
    a.download = "ratings.json"; a.click();
  };
  document.getElementById("back").onclick = () => { cur = order.length-1; save(); render(); };
}

/* colour any mention of a participant inside a post body, matching their header colour.
   runs on already-escaped text; names are alphanumeric so escaping can't split them. */
function markNames(html, pool) {
  if (!pool.length) return html;
  const alt = pool.slice().sort((a,b) => b.length - a.length)
                  .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const re = new RegExp("(^|[^A-Za-z0-9])(" + alt + ")(?![A-Za-z0-9])", "gi");
  return html.replace(re, (m, pre, name) =>
    pre + `<span class="ment" style="color:${hue(name.toLowerCase())}">${name}</span>`);
}

/* stable colour per handle so a speaker is trackable down the thread */
function hue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return `light-dark(hsl(${h} 62% 34%), hsl(${h} 58% 70%))`;
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
</script>
</body>
</html>
