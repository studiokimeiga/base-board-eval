<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>blind a/b</title>
<style>
  :root { color-scheme: light dark;
          --fg:#1b1b1b; --dim:#7a7a7a; --line:#dcdcdc; --bg:#fbfbf9; --accent:#2f5d8a;
          --hit:#2f7d4f; --bar:40px; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#dcdcd6; --dim:#8a8a84; --line:#333; --bg:#141414; --accent:#8ab4dd; --hit:#6fbf8f; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg); }
  body { font:13.5px/1.62 ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden; }
  .bar { position:fixed; top:0; left:0; right:0; height:var(--bar); z-index:10; background:var(--bg);
         border-bottom:1px solid var(--line); padding:10px 18px; font-size:12.5px; color:var(--dim);
         display:flex; gap:16px; align-items:baseline; }
  .bar b { color:var(--fg); font-weight:600; }
  .bar .sp { margin-left:auto; }
  #wrap { position:absolute; top:var(--bar); bottom:0; left:0; right:0; display:flex; flex-direction:column; }
  .premise { padding:9px 18px; border-bottom:1px solid var(--line); color:var(--dim); font-size:12.5px; }
  .premise span { color:var(--fg); }
  .pair { flex:1; display:flex; min-height:0; }
  .side { flex:1 1 50%; min-width:0; display:flex; flex-direction:column;
          border-right:1px solid var(--line); }
  .side:last-child { border-right:0; }
  .sh { padding:7px 16px; border-bottom:1px solid var(--line); font-weight:600; font-size:12.5px; }
  .body { flex:1; overflow-y:auto; padding:14px 16px 50px; }
  .post { margin:0 0 14px; }
  .meta { color:var(--dim); font-size:11.5px; }
  .who { font-weight:600; }
  .text { white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--dim); font-style:italic; }
  .foot { border-top:1px solid var(--line); padding:8px 18px; }
  .q { display:flex; gap:8px; align-items:center; margin:3px 0; font-size:12.5px; }
  .q .lbl { color:var(--dim); min-width:27ch; }
  button { font:inherit; font-size:12.5px; background:transparent; color:var(--fg);
           border:1px solid var(--line); border-radius:3px; padding:3px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .hint { color:var(--dim); font-size:12px; margin-left:auto; }
  .pad { padding:24px 28px 80px; overflow-y:auto; }
  table { border-collapse:collapse; font-size:12.5px; width:100%; margin-top:12px; }
  th,td { text-align:left; padding:5px 14px 5px 0; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; }
  h3 { font-weight:600; margin:22px 0 0; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="wrap"></div>

<script>
/* Blind paired comparison, three arms, judged in two stages.
     stage 1  A_old  vs B_new    -- the reader's question: is the older, chantier config
                                    actually more coherent?
     stage 2  B_new  vs C_noxtc  -- attributes any difference to XTC specifically.
   Sides randomised per pair. Arm identity never rendered until the standings screen.

   TWO questions per pair, because they can come apart and did once already: rating
   "would you keep reading" rewards prose competence, which is how the assistant-register
   thread beat a human-but-boring one. "More like real people" is the axis the
   observation was actually about. */
const KEY = "bbblind.v1";
const Q = [
  {id:'real', label:'more like real people?'},
  {id:'read', label:'would keep reading?'},
];
let threads = [], pairs = [], cur = 0, ans = {}, done = false;

const save = () => localStorage.setItem(KEY, JSON.stringify({pairs, cur, ans}));
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } };

fetch("threads.blind.json").then(r => r.json()).then(d => {
  threads = d.threads;
  const s = load();
  if (s.pairs && s.pairs.length) { pairs = s.pairs; cur = s.cur || 0; ans = s.ans || {}; }
  else { pairs = build(); save(); }
  render();
});

function build() {
  const idx = {};
  threads.forEach((t, i) => {
    if (t.quarantined) return;
    idx[t.arm + "/" + t.opener_index] = i;
  });
  const out = [];
  // stage 1 first, so stopping halfway still answers the question that was asked
  for (const [stage, x, y] of [[1, "A_old", "B_new"], [2, "B_new", "C_noxtc"]]) {
    const rows = [];
    for (let oi = 0; oi < 23; oi++) {
      const a = idx[x + "/" + oi], b = idx[y + "/" + oi];
      if (a === undefined || b === undefined) continue;
      rows.push(Math.random() < 0.5 ? {stage, l:a, r:b} : {stage, l:b, r:a});
    }
    for (let i = rows.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rows[i], rows[j]] = [rows[j], rows[i]];
    }
    out.push(...rows);
  }
  return out;
}

/* generation writes threads.blind.json incrementally, one arm at a time, so the file
   exists long before any pair can be formed. Say so plainly instead of rendering an
   empty standings table. */
function notReady(bar, wrap) {
  const c = {};
  threads.forEach(t => c[t.arm] = (c[t.arm] || 0) + 1);
  const have = Object.entries(c).map(([k, v]) => `${k}: ${v}`).join(" · ") || "none yet";
  bar.innerHTML = `<b>not ready</b><span>${threads.length} of 69 threads generated</span>`;
  wrap.innerHTML = `<div class="pad"><p style="font-size:15px">Still generating.</p>`
    + `<p style="color:var(--dim)">A pair needs the same opener from two different arms, and `
    + `the run produces one whole arm before starting the next — so there is nothing to `
    + `compare until the second arm is underway.</p>`
    + `<p>arms present &mdash; ${have}</p>`
    + `<p style="color:var(--dim)">Reload this page when the run finishes and the 46 pairs `
    + `will build themselves.</p>`
    + `<div class="q"><button id="rl">reload now</button></div></div>`;
  document.getElementById("rl").onclick = () => location.reload();
}

function a(i) { return ans[i] || (ans[i] = {}); }
const complete = i => Q.every(q => a(i)[q.id]);
const nDone = () => pairs.filter((_, i) => complete(i)).length;

function render() {
  const bar = document.getElementById("bar"), wrap = document.getElementById("wrap");
  if (!pairs.length) return notReady(bar, wrap);
  if (done || cur >= pairs.length) return standings(bar, wrap);
  const p = pairs[cur], L = threads[p.l], R = threads[p.r], v = a(cur);

  bar.innerHTML = `<b>stage ${p.stage} &middot; ${cur+1} / ${pairs.length}</b>`
    + `<span>${nDone()} done</span>`
    + `<span>${L.posts.length} vs ${R.posts.length} posts</span>`
    + `<span class="sp"></span><button id="st">standings</button>`;

  wrap.innerHTML =
      `<div class="premise">both open with: <span>${esc(L.posts[0].text)}</span></div>`
    + `<div class="pair">`
    +   `<div class="side"><div class="sh">LEFT</div><div class="body">${postsHTML(L)}</div></div>`
    +   `<div class="side"><div class="sh">RIGHT</div><div class="body">${postsHTML(R)}</div></div>`
    + `</div><div class="foot" id="foot"></div>`;

  const f = document.getElementById("foot");
  Q.forEach((q, qi) => {
    const row = document.createElement("div");
    row.className = "q";
    row.innerHTML = `<span class="lbl">${qi+1}. ${q.label}</span>`;
    [["L","← left"],["T","same"],["R","right →"]].forEach(([val, txt]) => {
      const b = document.createElement("button");
      b.textContent = txt;
      if (v[q.id] === val) b.className = "on";
      b.onclick = () => { v[q.id] = val; save(); if (complete(cur)) next(); else render(); };
      row.appendChild(b);
    });
    if (qi === 0) {
      const h = document.createElement("span");
      h.className = "hint";
      h.textContent = "a/s/d then j/k/l  ·  backspace to go back";
      row.appendChild(h);
    }
    f.appendChild(row);
  });
  document.getElementById("st").onclick = () => { done = true; render(); };
  document.querySelectorAll(".body").forEach(e => e.scrollTop = 0);
}

document.addEventListener("keydown", e => {
  if (done || cur >= pairs.length) return;
  const v = a(cur);
  const m1 = {a:"L", s:"T", d:"R"}, m2 = {j:"L", k:"T", l:"R"};
  if (m1[e.key]) { e.preventDefault(); v.real = m1[e.key]; }
  else if (m2[e.key]) { e.preventDefault(); v.read = m2[e.key]; }
  else if (e.key === "Backspace") { e.preventDefault(); if (cur > 0) { cur--; save(); render(); } return; }
  else return;
  save();
  if (complete(cur)) next(); else render();
});

function next() { cur++; save(); render(); }

function standings(bar, wrap) {
  done = true;
  bar.innerHTML = `<b>standings</b><span>${nDone()} of ${pairs.length} judged</span>`
    + `<span class="sp"></span><button id="bk">back</button><button id="ex">export</button>`;
  let html = `<div class="pad">`;
  for (const [stage, x, y] of [[1, "A_old", "B_new"], [2, "B_new", "C_noxtc"]]) {
    const rows = pairs.map((p, i) => ({p, i})).filter(o => o.p.stage === stage && complete(o.i));
    html += `<h3>stage ${stage}: ${x} vs ${y}</h3>`;
    if (!rows.length) { html += `<p style="color:var(--dim)">not judged yet</p>`; continue; }
    html += `<table><tr><th>question</th><th>${esc(x)}</th><th>${esc(y)}</th><th>same</th><th>n</th></tr>`;
    for (const q of Q) {
      const c = {}; c[x] = 0; c[y] = 0; c.same = 0;
      rows.forEach(o => {
        const v = ans[o.i][q.id];
        if (v === "T") { c.same++; return; }
        c[threads[v === "L" ? o.p.l : o.p.r].arm]++;
      });
      html += `<tr><td>${q.label}</td><td>${c[x]}</td><td>${c[y]}</td><td>${c.same}</td>`
           + `<td>${rows.length}</td></tr>`;
    }
    html += `</table>`;
  }
  html += `<p style="color:var(--dim);margin-top:20px">23 pairs per stage resolves a strong `
       + `preference (roughly 16-7 or better). Anything closer is noise at this n. If the two `
       + `questions disagree, that divergence is the finding.</p></div>`;
  wrap.innerHTML = html;
  document.getElementById("bk").onclick = () => { done = false; render(); };
  document.getElementById("ex").onclick = () => {
    const out = {exported: new Date().toISOString(), judgments: pairs.map((p, i) => complete(i) ? {
      pair: i, stage: p.stage,
      left: {arm: threads[p.l].arm, posts: threads[p.l].posts.length},
      right: {arm: threads[p.r].arm, posts: threads[p.r].posts.length},
      opener_index: threads[p.l].opener_index,
      real: ans[i].real, read: ans[i].read,
    } : null).filter(Boolean)};
    const el = document.createElement("a");
    el.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
    el.download = "blind.json"; el.click();
  };
}

function postsHTML(t) {
  let h = "";
  for (const p of t.posts.slice(1)) {
    const body = p.text ? mark(esc(p.text), t.participants || []) : `<span class="empty">[no text]</span>`;
    h += `<div class="post"><div class="meta">`
       + `<span class="who" style="color:${hue(p.who)}">${esc(p.who)}</span> ${p.ts}</div>`
       + `<div class="text">${body}</div></div>`;
  }
  return h;
}
function mark(s, pool) {
  if (!pool.length) return s;
  const alt = pool.slice().sort((a,b)=>b.length-a.length)
                  .map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
  return s.replace(new RegExp("(^|[^A-Za-z0-9])("+alt+")(?![A-Za-z0-9])","gi"),
    (m,pre,n)=>pre+`<span class="who" style="color:${hue(n.toLowerCase())}">${n}</span>`);
}
function hue(n) {
  let h = 0;
  for (let i = 0; i < n.length; i++) h = (h*31 + n.charCodeAt(i)) % 360;
  return `light-dark(hsl(${h} 62% 32%), hsl(${h} 58% 70%))`;
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
</script>
</body>
</html>
