<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind ratings</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #1b1d2a; --muted: #62667a; --line: #d9dce6;
  --name: #117743; --accent: #3651d4; --star: #c98a00; --gt: #5f7f1a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161c; --panel: #1d2029; --ink: #e2e5ec; --muted: #8e93a6; --line: #313545;
          --name: #5fd39a; --accent: #8fa2ff; --star: #ffc94a; --gt: #a6c95a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 16px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0 0 6px; color: var(--muted); max-width: 820px; }
header p.intro { color: var(--ink); font-weight: 600; }
header p.intro:empty { display: none; }
header label { font-size: 14px; }
header input { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
               background: var(--panel); color: var(--ink); }
nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; }
nav button { font: inherit; min-width: 36px; border: 1px solid var(--line); background: var(--panel);
             color: var(--ink); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
nav button.on { outline: 2px solid var(--accent); }
nav button.done { color: var(--name); }
main { padding: 0 16px 80px; max-width: 920px; }
.thread { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.thread h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
.post { padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
.post:first-of-type { border-top: 0; }
.post .h { font-size: 12px; color: var(--muted); }
.post .who { color: var(--name); font-weight: 600; }
.post .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.post .txt .gt { color: var(--gt); }
.post.star { box-shadow: inset 3px 0 0 var(--star); padding-left: 8px; }
.post.star .h::after { content: " ★"; color: var(--star); }
.rate { margin-top: 14px; display: grid; gap: 12px; }
.scale .q { font-weight: 600; }
.scale .q span { font-weight: 400; color: var(--muted); }
.scale .row { display: flex; gap: 4px; margin: 4px 0 2px; }
.scale .row button { flex: 1; font: inherit; padding: 6px 0; border: 1px solid var(--line); border-radius: 6px;
                     background: transparent; color: var(--ink); cursor: pointer; }
.scale .row button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.scale .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.checks { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
textarea { font: inherit; width: 100%; min-height: 48px; padding: 6px 8px; border: 1px solid var(--line);
           border-radius: 6px; background: var(--panel); color: var(--ink); }
.bar { display: flex; gap: 8px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.bar button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent);
              background: var(--accent); color: #fff; cursor: pointer; }
.bar button.ghost { background: transparent; color: var(--accent); }
.hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="heading">Blind ratings</h1>
  <p><span id="count">The</span> threads, one at a time, in an order made for you. Nothing says who
     or what wrote each one. Rate each thread on its own; click any line you think is great to mark
     it ★. Ratings stay in this browser until you press <b>Export</b>.</p>
  <p id="intro" class="intro"></p>
  <label>Your name <input id="rater" autocomplete="off" placeholder="for the export file"></label>
</header>
<nav id="nav" aria-label="Threads"></nav>
<main>
  <div id="page"></div>
  <div class="bar">
    <button id="prev" class="ghost">← Previous</button>
    <button id="next">Next →</button>
    <button id="export" class="ghost">Export ratings</button>
    <span class="hint" id="progress"></span>
  </div>
</main>
<script>
// ?set=r9 rates the round 9 set (key-r9.json) instead; each set keeps its own order and ratings
const SET = new URLSearchParams(location.search).get("set") === "r9" ? "r9" : "";
const STORE = SET ? "calibration-r9-v1" : "calibration-v1";
const ITEMS = SET ? "items-r9.json" : "items.json";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = t => esc(t).split("\n").map(l => l.startsWith("&gt;") ? `<span class="gt">${l}</span>` : l).join("\n");
let rubric, items = {}, S = {}, cur = 0;

function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function restore() { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; } }

// a seeded shuffle, so the order survives reloads but differs from rater to rater
function shuffled(ids, seed) {
  let a = seed >>> 0;
  const rand = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = ids.slice();
  for (let k = out.length - 1; k > 0; k--) { const j = Math.floor(rand() * (k + 1)); [out[k], out[j]] = [out[j], out[k]]; }
  return out;
}

const entry = id => (S.ratings[id] = S.ratings[id] || { stars: [], seen: false, unsafe: false, note: "" });
const isDone = id => { const r = S.ratings[id]; return !!r && rubric.scales.every(s => r[s.id]) && typeof r.repost === "boolean"; };

function render() {
  const id = S.order[cur], it = items[id], r = entry(id);
  $("nav").innerHTML = S.order.map((x, k) =>
    `<button class="${k === cur ? "on" : ""} ${isDone(x) ? "done" : ""}" data-go="${k}" aria-label="Thread ${k + 1}${isDone(x) ? ", rated" : ""}">${k + 1}${isDone(x) ? "✓" : ""}</button>`).join("");
  $("page").innerHTML = `<div class="thread"><h2>Thread ${cur + 1} of ${S.order.length}</h2>
    ${it.posts.map(p => `<div class="post ${r.stars.includes(p.n) ? "star" : ""}" data-star="${p.n}">
      <div class="h">${p.n}. <span class="who">${esc(p.who)}</span>${p.op ? " (OP)" : ""}</div>
      <div class="txt">${p.text ? fmt(p.text) : "<i>(empty post)</i>"}</div></div>`).join("")}</div>
    <div class="rate">
      ${rubric.scales.map(s => `<div class="scale"><div class="q">${esc(s.label)} <span>${esc(s.ask)}</span></div>
        <div class="row">${[1, 2, 3, 4, 5].map(v => `<button class="${r[s.id] === v ? "on" : ""}" data-scale="${s.id}" data-v="${v}">${v}</button>`).join("")}</div>
        <div class="ends"><span>1 = ${esc(s.low)}</span><span>5 = ${esc(s.high)}</span></div></div>`).join("")}
      <div class="scale"><div class="q">Would repost <span>${esc(rubric.repost)}</span></div>
        <div class="row"><button class="${r.repost === true ? "on" : ""}" data-repost="1">Yes</button>
        <button class="${r.repost === false ? "on" : ""}" data-repost="0">No</button></div></div>
      <div class="checks">
        <label><input type="checkbox" data-flag="seen" ${r.seen ? "checked" : ""}> I've seen this thread before</label>
        <label><input type="checkbox" data-flag="unsafe" ${r.unsafe ? "checked" : ""}> I wouldn't publish this</label>
      </div>
      <textarea data-note placeholder="Notes (optional)">${esc(r.note || "")}</textarea>
    </div>`;
  $("progress").textContent = `${S.order.filter(isDone).length} of ${S.order.length} rated`;
}

function touch(id) { S.ratings[id].t = new Date().toISOString(); save(); }

document.addEventListener("click", e => {
  const id = S.order && S.order[cur];
  const go = e.target.closest("[data-go]"); if (go) { cur = +go.dataset.go; render(); scrollTo(0, 0); return; }
  const sc = e.target.closest("[data-scale]"); if (sc) { entry(id)[sc.dataset.scale] = +sc.dataset.v; touch(id); render(); return; }
  const rp = e.target.closest("[data-repost]"); if (rp) { entry(id).repost = rp.dataset.repost === "1"; touch(id); render(); return; }
  const st = e.target.closest("[data-star]");
  if (st) { const r = entry(id), n = +st.dataset.star; r.stars = r.stars.includes(n) ? r.stars.filter(x => x !== n) : r.stars.concat(n).sort((a, b) => a - b); touch(id); render(); }
});
document.addEventListener("change", e => {
  const id = S.order[cur], f = e.target.dataset && e.target.dataset.flag;
  if (f) { entry(id)[f] = e.target.checked; touch(id); render(); }
});
document.addEventListener("input", e => {
  if (e.target.matches("[data-note]")) { entry(S.order[cur]).note = e.target.value; touch(S.order[cur]); }
  if (e.target.id === "rater") { S.rater = e.target.value.trim(); save(); }
});
$("prev").onclick = () => { cur = (cur + S.order.length - 1) % S.order.length; render(); scrollTo(0, 0); };
$("next").onclick = () => { cur = (cur + 1) % S.order.length; render(); scrollTo(0, 0); };
$("export").onclick = () => {
  const n = S.order.filter(isDone).length;
  if (!S.rater) { alert("Add your name first, so the file says whose ratings these are."); $("rater").focus(); return; }
  if (n < S.order.length && !confirm(`${n} of ${S.order.length} threads are fully rated. Export anyway?`)) return;
  const out = { rater: S.rater, set: SET || "calibration", rubric_version: rubric.version, seed: S.seed,
                order: S.order, started: S.started, exported: new Date().toISOString(), ratings: S.ratings };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = `ratings-${SET ? SET + "-" : ""}${S.rater.replace(/[^a-z0-9_-]+/gi, "-")}-${out.exported.slice(0, 10)}.json`;
  a.click();
};

if (SET) document.title = $("heading").textContent = "Blind ratings: round 9";
Promise.all([fetch("rubric.json").then(r => r.json()),
             fetch(ITEMS + "?" + Date.now()).then(r => { if (!r.ok) throw new Error(ITEMS + " " + r.status); return r.json(); })])
  .then(([rb, data]) => {
    rubric = rb;
    // the same instructions the AI judges get, including "Keep 5 rare"
    $("intro").textContent = rubric.intro || "";
    data.items.forEach(it => items[it.id] = it);
    $("count").textContent = data.items.length;
    const ids = Object.keys(items).sort();
    const old = restore();
    if (old && old.order && old.order.length === ids.length && old.order.every(x => items[x])) S = old;
    else { const seed = Math.floor(Math.random() * 2 ** 32);
           S = { seed, order: shuffled(ids, seed), started: new Date().toISOString(), ratings: {}, rater: "" }; save(); }
    $("rater").value = S.rater || "";
    const first = S.order.findIndex(x => !isDone(x));
    cur = first < 0 ? 0 : first;
    render();
  })
  .catch(e => { $("page").innerHTML = `<p class="hint">Couldn't load the threads (${esc(String(e))}). Build them with
    <code>python calibration/build.py</code>, then serve the repo root with <code>python -m http.server 8000</code>.</p>`; });
</script>
</body>
</html>
